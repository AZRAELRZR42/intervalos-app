<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a192f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cronómetro de Intervalos</title>
<style>
  :root {
    --bg: #081221; --bg2: #172a46; --card-rgb: 10, 25, 47; --alpha: 0.32; --blur: 7px;
    --work: #fbbf24; --rest: #2dd4bf; --prep: #38bdf8; --accent: #fbbf24;
    --text: #fef3c7; --muted: #fde68a; --border: rgba(251, 191, 36, 0.45); --bg-img: none;
  }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:0; }
  body {
    background: var(--bg-img), radial-gradient(circle at top, var(--bg2), var(--bg) 78%);
    background-size: cover; background-position: center; background-attachment: fixed;
    color: var(--text); display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 14px; transition: background 0.4s;
  }
  .barra-sup { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .insignia-cultura {
    background: rgba(var(--card-rgb), 0.55); backdrop-filter: blur(8px);
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
    font-size: 0.8rem; font-weight: 800; letter-spacing: 0.8px; color: var(--accent);
  }
  .btn-menu {
    background: rgba(var(--card-rgb), 0.55); backdrop-filter: blur(8px); color: var(--text);
    border: 1px solid var(--border); padding: 7px 14px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; cursor: pointer;
  }
  .menu-estilo {
    display: none; width: 100%; max-width: 420px; background: rgba(var(--card-rgb), 0.84);
    backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 20px;
    padding: 14px; margin-bottom: 12px;
  }
  .menu-estilo.abierto { display: block; }
  .temas-grid { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .tema-chip {
    background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  .control-transp { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; margin-bottom: 10px; }
  .control-transp input[type="range"] { flex: 1; accent-color: var(--accent); }
  .acciones-fondo { display: flex; gap: 8px; justify-content: center; }
  .foto-btn {
    background: rgba(255,255,255,0.12); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }
  .panel {
    position: relative; background: rgba(var(--card-rgb), var(--alpha)); backdrop-filter: blur(var(--blur));
    width: 100%; max-width: 420px; border-radius: 26px; padding: 18px 20px; text-align: center;
    border: 2px solid var(--border); box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  }
  .esquina { position: absolute; width: 22px; height: 22px; border-color: var(--accent); border-style: solid; opacity: 0.85; pointer-events: none; }
  .esquina.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; border-top-left-radius: 12px; }
  .esquina.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; border-top-right-radius: 12px; }
  .esquina.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; border-bottom-left-radius: 12px; }
  .esquina.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-bottom-right-radius: 12px; }
  .anillo-wrap { position:relative; width:236px; height:236px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; }
  svg.anillo { position:absolute; top:0; left:0; width:100%; height:100%; filter:drop-shadow(0 0 10px rgba(0,0,0,0.65)); }
  circle.fondo { fill:none; stroke:rgba(255,255,255,0.12); stroke-width:9; }
  circle.progreso {
    fill:none; stroke:var(--prep); stroke-width:9; stroke-linecap:round;
    stroke-dasharray:565; stroke-dashoffset:0; transform:rotate(-90deg); transform-origin:118px 118px;
    transition:stroke-dashoffset 0.35s linear, stroke 0.3s;
  }
  .centro-reloj { z-index:2; display:flex; flex-direction:column; align-items:center; text-shadow:0 2px 10px rgba(0,0,0,0.85); }
  .simbolo-top { font-size: 1.25rem; line-height: 1; margin-bottom: 2px; color: var(--accent); }
  .estado { font-size:0.86rem; font-weight:800; letter-spacing:1.8px; text-transform:uppercase; color:var(--prep); }
  .reloj { font-size:2.75rem; font-weight:800; font-variant-numeric:tabular-nums; margin:1px 0; transition:transform 0.15s; }
  .latido { transform:scale(1.09); }
  .ronda { font-size:0.84rem; color:var(--muted); font-weight:700; }
  .presets { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .presets button { background:rgba(0,0,0,0.32); color:var(--text); border:1px solid var(--border); padding:7px 11px; border-radius:12px; font-size:0.82rem; font-weight:600; cursor:pointer; }
  .filas { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .fila { display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.32); padding:8px 14px; border-radius:14px; border:1px solid var(--border); }
  .fila span.titulo { font-size:0.9rem; font-weight:600; }
  .tiempo-par { display:flex; align-items:center; gap:5px; }
  .tiempo-par input { width:54px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:var(--text); padding:6px; border-radius:9px; text-align:center; font-size:1.05rem; font-weight:700; }
  .tiempo-par b { color:var(--muted); font-size:1.1rem; }
  .controles { display:flex; gap:10px; }
  .btn { flex:1; border:none; padding:14px; border-radius:15px; font-size:1rem; font-weight:800; cursor:pointer; color:#090d16; }
  .btn-start { background:var(--work); }
  .btn-pause { background:var(--rest); }
  .btn-stop { background:#dc2626; color:#fff; }
  .resumen-hoy { margin-top:10px; font-size:0.8rem; color:var(--muted); font-weight:600; }
</style>
</head>
<body>
  <div class="barra-sup">
    <div id="insigniaCultura" class="insignia-cultura">🏺 ANTIGUO EGIPTO</div>
    <button class="btn-menu" onclick="toggleMenuEstilo()">✨ Estilo Místico</button>
  </div>
  <div id="menuEstilo" class="menu-estilo">
    <div class="temas-grid">
      <button class="tema-chip" onclick="aplicarTema('egipto')">🏺 Egipto</button>
      <button class="tema-chip" onclick="aplicarTema('maya')">🌿 Maya</button>
      <button class="tema-chip" onclick="aplicarTema('vikingo')">⚡ Vikingo</button>
      <button class="tema-chip" onclick="aplicarTema('samurai')">⛩️ Samurái</button>
      <button class="tema-chip" onclick="aplicarTema('grecia')">🏛️ Grecia</button>
    </div>
    <div class="control-transp">
      <span>👁️ Opacidad</span>
      <input id="rangoAlpha" type="range" min="5" max="90" value="32" oninput="ajustarOpacidad(this.value)">
      <span id="txtAlpha">32%</span>
    </div>
    <div class="acciones-fondo">
      <label class="foto-btn">🖼️ Elegir Fondo <input type="file" accept="image/*" hidden onchange="cargarFondo(event)"></label>
      <button class="foto-btn" onclick="quitarFondo()">✕ Quitar Fondo</button>
    </div>
  </div>
  <div class="panel">
    <span class="esquina tl"></span><span class="esquina tr"></span>
    <span class="esquina bl"></span><span class="esquina br"></span>
    <div class="anillo-wrap">
      <svg class="anillo" viewBox="0 0 236 236">
        <g id="grabadoCultural"></g>
        <circle class="fondo" cx="118" cy="118" r="90"></circle>
        <circle id="arco" class="progreso" cx="118" cy="118" r="90"></circle>
      </svg>
      <div class="centro-reloj">
        <div id="simboloTop" class="simbolo-top">𓂀</div>
        <div id="estado" class="estado">Listo</div>
        <div id="reloj" class="reloj">10' 00"</div>
        <div id="ronda" class="ronda">Ronda 0 / 4</div>
      </div>
    </div>
    <div class="presets">
      <button onclick="setPreset(10,0,2,0,4)">🪢 Cuerda 10' / 2'</button>
      <button onclick="setPreset(0,45,0,15,8)">🔥 HIIT 45" / 15"</button>
      <button onclick="setPreset(0,20,0,10,8)">⚡ Tabata 20" / 10"</button>
    </div>
    <div class="filas">
      <div class="fila"><span class="titulo">🔥 Ejercicio</span><div class="tiempo-par"><input id="wMin" type="number" value="10" min="0" max="99" onchange="syncPreview()"><b>'</b><input id="wSec" type="number" value="0" min="0" max="59" onchange="syncPreview()"><b>"</b></div></div>
      <div class="fila"><span class="titulo">😮‍💨 Descanso</span><div class="tiempo-par"><input id="rMin" type="number" value="2" min="0" max="99"><b>'</b><input id="rSec" type="number" value="0" min="0" max="59"><b>"</b></div></div>
      <div class="fila"><span class="titulo">🔄 Rondas</span><div class="tiempo-par"><input id="inRounds" type="number" value="4" min="1" max="50" onchange="syncPreview()"></div></div>
    </div>
    <div class="controles">
      <button id="btnMain" class="btn btn-start" onclick="toggleTimer()">▶ Iniciar</button>
      <button class="btn btn-stop" onclick="resetTimer()">⏹ Reiniciar</button>
    </div>
    <div id="resumenHoy" class="resumen-hoy">Hoy: 0 rondas · 0 min entrenados</div>
  </div>
<script>
const GRABADOS = {
  egipto: '<circle cx="118" cy="118" r="106" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="14 6 3 6"/><polygon points="118,5 125,17 111,17" fill="#fbbf24"/><polygon points="118,231 125,219 111,219" fill="#fbbf24"/><polygon points="5,118 17,111 17,125" fill="#fbbf24"/><polygon points="231,118 219,111 219,125" fill="#fbbf24"/>',
  maya: '<circle cx="118" cy="118" r="107" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="10 4 4 4"/><rect x="112" y="4" width="12" height="12" transform="rotate(45 118 10)" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="112" y="220" width="12" height="12" transform="rotate(45 118 226)" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="4" y="112" width="12" height="12" transform="rotate(45 10 118)" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="220" y="112" width="12" height="12" transform="rotate(45 226 118)" fill="none" stroke="#f59e0b" stroke-width="1.8"/>',
  vikingo: '<circle cx="118" cy="118" r="106" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 7"/><line x1="118" y1="4" x2="118" y2="22" stroke="#38bdf8" stroke-width="2"/><line x1="118" y1="214" x2="118" y2="232" stroke="#38bdf8" stroke-width="2"/><line x1="4" y1="118" x2="22" y2="118" stroke="#38bdf8" stroke-width="2"/><line x1="214" y1="118" x2="232" y2="118" stroke="#38bdf8" stroke-width="2"/><line x1="37" y1="37" x2="50" y2="50" stroke="#94a3b8" stroke-width="1.8"/><line x1="186" y1="186" x2="199" y2="199" stroke="#94a3b8" stroke-width="1.8"/><line x1="199" y1="37" x2="186" y2="50" stroke="#94a3b8" stroke-width="1.8"/><line x1="50" y1="186" x2="37" y2="199" stroke="#94a3b8" stroke-width="1.8"/>',
  samurai: '<circle cx="118" cy="118" r="105" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="520 45"/><circle cx="118" cy="118" r="112" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="2 8"/><circle cx="118" cy="10" r="4" fill="#eab308"/><circle cx="118" cy="226" r="4" fill="#eab308"/>',
  grecia: '<circle cx="118" cy="118" r="106" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="12 4 4 4 4 4"/><circle cx="118" cy="118" r="99" fill="none" stroke="#facc15" stroke-width="1" stroke-dasharray="4 6"/><polygon points="118,4 123,14 113,14" fill="#facc15"/><polygon points="118,232 123,222 113,222" fill="#facc15"/>'
};
const TEMAS = {
  egipto:  { etiqueta:'🏺 ANTIGUO EGIPTO', simbolo:'𓂀', accent:'#fbbf24', bg:'#081221', bg2:'#1e3a8a', 'card-rgb':'10, 25, 47', work:'#fbbf24', rest:'#2dd4bf', prep:'#38bdf8', text:'#fef3c7', muted:'#fde68a', border:'rgba(251, 191, 36, 0.45)' },
  maya:    { etiqueta:'🌿 COSMOS MAYA',    simbolo:'☀', accent:'#10b981', bg:'#05140e', bg2:'#064e3b', 'card-rgb':'6, 28, 20',  work:'#10b981', rest:'#f59e0b', prep:'#34d399', text:'#ecfdf5', muted:'#a7f3d0', border:'rgba(16, 185, 129, 0.45)' },
  vikingo: { etiqueta:'⚡ RUNAS NÓRDICAS', simbolo:'ᛟ', accent:'#38bdf8', bg:'#070d19', bg2:'#1e293b', 'card-rgb':'12, 20, 38', work:'#38bdf8', rest:'#f97316', prep:'#94a3b8', text:'#f0f9ff', muted:'#bae6fd', border:'rgba(56, 189, 248, 0.45)' },
  samurai: { etiqueta:'⛩️ SENDA BUSHIDO',  simbolo:'⛩️', accent:'#ef4444', bg:'#090507', bg2:'#450a0a', 'card-rgb':'24, 8, 12',  work:'#ef4444', rest:'#eab308', prep:'#f472b6', text:'#fff1f2', muted:'#fecdd3', border:'rgba(239, 68, 68, 0.48)' },
  grecia:  { etiqueta:'🏛️ OLIMPO CLÁSICO', simbolo:'Ω', accent:'#c084fc', bg:'#110921', bg2:'#3b0764', 'card-rgb':'22, 12, 42', work:'#c084fc', rest:'#facc15', prep:'#22d3ee', text:'#faf5ff', muted:'#e9d5ff', border:'rgba(192, 132, 252, 0.45)' }
};
function toggleMenuEstilo() { document.getElementById('menuEstilo').classList.toggle('abierto'); }
function ajustarOpacidad(val) {
  const num = Math.max(5, Math.min(90, parseInt(val) || 32));
  document.documentElement.style.setProperty('--alpha', (num / 100).toFixed(2));
  document.documentElement.style.setProperty('--blur', Math.round((num / 90) * 14) + 'px');
  document.getElementById('txtAlpha').textContent = num + '%';
  document.getElementById('rangoAlpha').value = num;
  localStorage.setItem('hiit_alpha', num);
}
function aplicarTema(n) {
  const t = TEMAS[n] || TEMAS.egipto, r = document.documentElement.style;
  ['accent','bg','bg2','card-rgb','work','rest','prep','text','muted','border'].forEach(k => r.setProperty('--' + k, t[k]));
  document.getElementById('insigniaCultura').textContent = t.etiqueta;
  document.getElementById('simboloTop').textContent = t.simbolo;
  document.getElementById('grabadoCultural').innerHTML = GRABADOS[n] || GRABADOS.egipto;
  localStorage.setItem('hiit_tema', n); updateUI();
}
function cargarFondo(ev) {
  const file = ev.target.files && ev.target.files.item(0);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const u = 'url("' + reader.result + '")';
    document.documentElement.style.setProperty('--bg-img', u);
    try { localStorage.setItem('hiit_fondo', u); } catch (e) {}
  };
  reader.readAsDataURL(file);
}
function quitarFondo() { document.documentElement.style.setProperty('--bg-img', 'none'); localStorage.removeItem('hiit_fondo'); }
let timer = null, phase = 'idle', rem = 600, totalPhase = 600, round = 0, wakeLock = null;
const PERIMETRO = 565, ctx = new (window.AudioContext || window.webkitAudioContext)();
const getWorkSec = () => (parseInt(document.getElementById('wMin').value)||0)*60 + (parseInt(document.getElementById('wSec').value)||0);
const getRestSec = () => (parseInt(document.getElementById('rMin').value)||0)*60 + (parseInt(document.getElementById('rSec').value)||0);

function tone(freqs, dur=0.18) {
  if (ctx.state === 'suspended') ctx.resume();
  freqs.forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.35, ctx.currentTime + i*(dur+0.05));
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*(dur+0.05) + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + i*(dur+0.05)); o.stop(ctx.currentTime + i*(dur+0.05) + dur);
  });
}
function speak(txt) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-MX'; u.rate = 1.1; speechSynthesis.speak(u);
}
const vibrar = p => { if ('vibrate' in navigator) navigator.vibrate(p); };
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + "' " + String(s%60).padStart(2,'0') + '"';

function sumarProgreso(seg) {
  const hoy = new Date().toISOString().slice(0,10), st = JSON.parse(localStorage.getItem('hiit_stats')||'{}');
  if (st.fecha !== hoy) { st.fecha = hoy; st.rondas = 0; st.seg = 0; }
  st.rondas += 1; st.seg += seg; localStorage.setItem('hiit_stats', JSON.stringify(st)); mostrarProgreso();
}
function mostrarProgreso() {
  const hoy = new Date().toISOString().slice(0,10), st = JSON.parse(localStorage.getItem('hiit_stats')||'{}');
  const r = st.fecha===hoy ? st.rondas : 0, m = st.fecha===hoy ? Math.round(st.seg/60) : 0;
  document.getElementById('resumenHoy').textContent = 'Hoy: ' + r + ' rondas · ' + m + ' min entrenados';
}
function updateUI() {
  const est = document.getElementById('estado'), arco = document.getElementById('arco');
  const totR = parseInt(document.getElementById('inRounds').value) || 1;
  document.getElementById('reloj').textContent = fmt(rem);
  document.getElementById('ronda').textContent = 'Ronda ' + round + ' / ' + totR;
  const color = phase==='work' ? 'var(--work)' : phase==='rest' ? 'var(--rest)' : 'var(--prep)';
  est.textContent = phase==='prep' ? 'Prepárate' : phase==='work' ? '¡Entrenando!' : phase==='rest' ? 'Descanso' : 'Listo';
  est.style.color = color; arco.style.stroke = color;
  const frac = totalPhase > 0 ? Math.max(0, Math.min(1, rem / totalPhase)) : 1;
  arco.style.strokeDashoffset = PERIMETRO * (1 - frac);
}
function syncPreview() { if (phase === 'idle') { rem = Math.max(1, getWorkSec()); totalPhase = rem; updateUI(); } }
function setPreset(wm, ws, rm, rs, rnd) {
  resetTimer();
  document.getElementById('wMin').value = wm; document.getElementById('wSec').value = ws;
  document.getElementById('rMin').value = rm; document.getElementById('rSec').value = rs;
  document.getElementById('inRounds').value = rnd;
  rem = Math.max(1, getWorkSec()); totalPhase = rem; updateUI();
}
function toggleTimer() {
  const btn = document.getElementById('btnMain');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶ Reanudar'; btn.className = 'btn btn-start'; keepAwake(false); return; }
  if (phase === 'idle') { phase = 'prep'; rem = 5; totalPhase = 5; round = 1; speak('Prepárate'); }
  btn.textContent = '⏸ Pausar'; btn.className = 'btn btn-pause'; keepAwake(true); updateUI();
  timer = setInterval(() => {
    rem--;
    const relojEl = document.getElementById('reloj');
    if (rem <= 3 && rem >= 1) { speak(String(rem)); relojEl.classList.add('latido'); setTimeout(() => relojEl.classList.remove('latido'), 200); }
    if (rem <= 0) {
      const workS = Math.max(1, getWorkSec()), restS = Math.max(0, getRestSec()), totR = parseInt(document.getElementById('inRounds').value) || 1;
      if (phase === 'prep' || phase === 'rest') {
        phase = 'work'; rem = workS; totalPhase = workS;
        tone(new Array(880, 1320), 0.2); speak('Empieza ronda ' + round); vibrar(200);
      } else if (phase === 'work') {
        sumarProgreso(workS);
        if (round < totR && restS > 0) {
          round++; phase = 'rest'; rem = restS; totalPhase = restS;
          tone(new Array(660, 440), 0.22); speak('Tiempo terminado. Descanso'); vibrar(new Array(150, 80, 150));
        } else if (round < totR) {
          round++; phase = 'work'; rem = workS; totalPhase = workS;
          tone(new Array(880, 1320), 0.2); speak('Ronda ' + round); vibrar(200);
        } else {
          tone(new Array(880, 1108, 1320), 0.2); speak('Entrenamiento terminado. Excelente trabajo'); vibrar(new Array(200, 100, 200, 100, 300));
          resetTimer(); return;
        }
      }
    }
    updateUI();
  }, 1000);
}
function resetTimer() {
  clearInterval(timer); timer = null; phase = 'idle'; round = 0;
  rem = Math.max(1, getWorkSec()); totalPhase = rem;
  const btn = document.getElementById('btnMain'); btn.textContent = '▶ Iniciar'; btn.className = 'btn btn-start';
  keepAwake(false); updateUI();
}
(function init() {
  aplicarTema(localStorage.getItem('hiit_tema') || 'egipto');
  ajustarOpacidad(localStorage.getItem('hiit_alpha') || 32);
  const f = localStorage.getItem('hiit_fondo'); if (f) document.documentElement.style.setProperty('--bg-img', f);
  mostrarProgreso();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
